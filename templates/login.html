{% extends "base.html" %}

{% block title %}Login - ServiceHub{% endblock %}

{% block content %}
<div class="container-sm">
    <div class="card" style="box-shadow: var(--shadow-lux); padding: 2.75rem 2.25rem; background: #ffffff; border: 1.5px solid #B1A6A4; border-radius: var(--radius-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="dash-icon" style="margin: 0 auto 1rem; width: 64px; height: 64px; font-size: 1.8rem; background: #D8CFD0; color: #413F3D; border: 1.5px solid #B1A6A4;">
                🔑
            </div>
            <h1 style="font-size: 1.85rem; font-weight: 800; color: #413F3D; font-family: var(--font-heading);">Welcome Back</h1>
            <p style="color: #697184; font-size: 0.95rem; margin-top: 0.25rem;">
                Login to access your bookings, services, or job needs
            </p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="email" style="color: #413F3D; font-weight: 700;">Email Address <span class="required">*</span></label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                    autocomplete="email"
                    style="background: #F2F1EF; border: 1.5px solid #B1A6A4; color: #413F3D;"
                >
            </div>

            <div class="form-group">
                <label for="password" style="color: #413F3D; font-weight: 700;">Password <span class="required">*</span></label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your account password"
                    required
                    autocomplete="current-password"
                    style="background: #F2F1EF; border: 1.5px solid #B1A6A4; color: #413F3D;"
                >
            </div>

            <button type="submit" class="btn btn-gold btn-block btn-lg" style="margin-top: 1.5rem; font-weight: 800;">
                🚀 Login to ServiceHub
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #B1A6A4; font-size: 0.95rem;">
            <p style="color: #697184; margin-bottom: 0.5rem;">
                Don't have an account yet?
                <a href="/signup" style="font-weight: 700; color: #413F3D;">Create an Account</a>
            </p>
            <p style="color: #697184; font-size: 0.88rem;">
                👑 Platform Administrator?
                <a href="/admin/login" style="font-weight: 700; color: #413F3D;">Admin Command Login</a>
            </p>
            <div style="margin-top: 0.75rem;">
                <a href="/" style="color: #697184; font-size: 0.85rem;">⬅ Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
